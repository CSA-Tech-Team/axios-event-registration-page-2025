server {
    listen 3000;
    server_name localhost;

    root /var/www/html;
    index index.html;

    # Hashed Vite assets are content-addressed, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker and manifest must never be served stale, or clients
    # pin themselves to an old build.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # React Router owns the routes, so every unmatched path has to reach
    # index.html - otherwise a reload on /leaderboard 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
