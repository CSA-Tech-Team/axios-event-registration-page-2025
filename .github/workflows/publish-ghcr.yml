name: Publish frontend image

on:
  push:
    branches: [master]
    paths:
      - '**'
      - '!docs/**'
      - '!README.md'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/csa-tech-team/axios-event-registration-page-2025
  BACKEND_URL: https://darpanet.psgtech.ac.in/api

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_DARPANET_HOST=${{ env.BACKEND_URL }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=axios-event-registration-page
          cache-to: type=gha,mode=max,scope=axios-event-registration-page
